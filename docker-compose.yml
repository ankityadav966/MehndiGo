services:
  postgres:
    image: postgres:16
    container_name: mehndigo_postgres
    restart: always

    environment:
      POSTGRES_USER: ankit
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: mehndigo_db

    ports:
      - "5434:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: mehndigo_pgadmin
    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: mehndigo_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata: {}
  redisdata: {}