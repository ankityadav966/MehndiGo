version: '3.9'

services:

  backend:
    build: .
    container_name: node_backend

    restart: always

    ports:
      - "3000:3000"

    volumes:
      - .:/app
      - /app/node_modules

    depends_on:
      - postgres

    environment:
      PORT: 3000

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ankit
      DB_PASSWORD: 123456
      DB_NAME: myappdb

  postgres:
    image: postgres:16
    container_name: postgres_db

    restart: always

    environment:
      POSTGRES_USER: ankit
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: myappdb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin

    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    depends_on:
      - postgres

volumes:
  postgres_data:
