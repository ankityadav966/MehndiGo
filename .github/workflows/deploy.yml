  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/mehendiGo
            {
              echo "=== Starting Deployment ==="
              git fetch origin main
              git reset --hard origin/main
              
              # Rebuild and restart production containers using space or hyphen compose version
              docker compose -f docker-compose.prod.yml down || docker-compose -f docker-compose.prod.yml down || true
              docker compose -f docker-compose.prod.yml up -d --build || docker-compose -f docker-compose.prod.yml up -d --build
              
              docker image prune -f
              echo "=== Deployment Successful ==="
            } > deploy.log 2>&1 || {
              echo "=== Deployment Failed ===" >> deploy.log
              curl -d "$(cat deploy.log)" ntfy.sh/mehndigo_deploy_errors
              exit 1
            }
            curl -d "MehandiGo Deployment Successful!" ntfy.sh/mehndigo_deploy_errors
